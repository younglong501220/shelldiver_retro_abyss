name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# 設定 GITHUB_TOKEN 的權限，以允許部署至 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允許同時只有一個並行部署，跳過執行中的舊建置
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # 移除強制依賴 lockfile 的快取設定，無論倉庫內是否有 package-lock.json 都能順暢完成

      - name: Install dependencies # 使用 --legacy-peer-deps 徹底避免套件版本衝突失敗
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
